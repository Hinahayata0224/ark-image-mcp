[project]
name = "ark-image-mcp"
version = "0.2.0"
description = "MCP server for 火山方舟 (Volcano Ark) Doubao-Seedream image generation and editing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hinahayata0224" }]
keywords = ["mcp", "image-generation", "seedream", "volcengine", "ark"]
dependencies = [
    "mcp[cli]>=1.6.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
